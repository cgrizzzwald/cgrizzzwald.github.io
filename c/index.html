<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hungry Pug Challenge</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: #1A0E06;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
  }
  main { max-width: 420px; width: 100%; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 16px; color: #FFCC33; }
  .id { font-size: 18px; margin: 0 0 28px; color: rgba(255, 255, 255, 0.75); }
  .id strong { color: #fff; letter-spacing: 0.12em; }
  .button {
    display: inline-block;
    min-height: 48px;
    padding: 12px 32px;
    border-radius: 999px;
    background: #5CB83A;
    color: #1A0E06;
    font-weight: 800;
    font-size: 18px;
    text-decoration: none;
  }
  .hint { margin: 24px 0 0; font-size: 15px; color: rgba(255, 255, 255, 0.65); }
</style>
</head>
<body>
<main>
  <h1>Someone challenged you in Hungry Pug!</h1>
  <p class="id" id="challenge" hidden>Challenge <strong id="challenge-id"></strong></p>
  <a class="button" href="https://apps.apple.com/app/id6449939021">Get it on the App Store</a>
  <p class="hint">Already have the app? Tap the link again.</p>
</main>
<script>
  (function () {
    var raw = new URLSearchParams(location.search).get("id") || "";
    var id = raw.trim().toUpperCase();
    // Same alphabet and length as the app's challenge IDs; anything else isn't shown.
    if (/^[2-9A-HJKMNP-Z]{6}$/.test(id)) {
      document.getElementById("challenge-id").textContent = id;
      document.getElementById("challenge").hidden = false;
    }
  })();
</script>
</body>
</html>
